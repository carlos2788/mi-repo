
# azure-pipelines.yml
trigger:
  - main

variables:
  environment: 'dev'                        # p.ej.: dev/staging/prod
  appName: 'mi-azdevops-cd-staging'        # nombre EXACTO de tu App Service
  NUGET_PACKAGES: '$(Pipeline.Workspace)/.nuget/packages'

pool:
  vmImage: 'ubuntu-latest'

stages:
  # =======================
  #        BUILD
  # =======================
  - stage: Build
    displayName: 'Compilar, testear y empaquetar'
    jobs:
      - job: BuildJob
        displayName: 'Build job'
        steps:
          - checkout: self
            displayName: 'Checkout repo'

          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK 10.x'
            inputs:
              packageType: 'sdk'
              version: '10.0.100'          # cambia si usas otra versión

          # Diagnóstico
          - script: dotnet --info
            displayName: '.NET info'
          - script: dotnet --list-sdks
            displayName: 'SDKs instalados'

          # Preparar carpeta de caché
          - script: mkdir -p '$(NUGET_PACKAGES)'
            displayName: 'Crear carpeta NuGet en workspace'

          # Cache NuGet (key en UNA sola línea)
          - task: Cache@2
            displayName: 'Cache NuGet (packages)'
            inputs:
              key: 'nuget | $(Agent.OS) | **/packages.lock.json, **/*.csproj, **/*.fsproj, **/*.vbproj'
              restoreKeys: 'nuget | $(Agent.OS)'
              path: '$(NUGET_PACKAGES)'

          # Restore
          - script: dotnet restore MiApp.slnx
            displayName: 'Restore (.slnx)'
            workingDirectory: '$(Build.SourcesDirectory)'
            env:
              NUGET_PACKAGES: '$(NUGET_PACKAGES)'

          # Build
          - script: dotnet build MiApp.slnx -c Release --no-restore
            displayName: 'Build (.slnx)'
            workingDirectory: '$(Build.SourcesDirectory)'
            env:
              NUGET_PACKAGES: '$(NUGET_PACKAGES)'

          # Test (permitir continuar si el proyecto de tests no existe aún)
          - script: dotnet test test/MiApp.Tests/MiApp.Tests.csproj -c Release --no-build
            displayName: 'Test (permitir continuar si está vacío)'
            workingDirectory: '$(Build.SourcesDirectory)'
            continueOnError: true
            env:
              NUGET_PACKAGES: '$(NUGET_PACKAGES)'

          # =======================
          #      PUBLICAR + ZIP
          # =======================

          # Publicar binarios de la solución
          - script: dotnet publish MiApp.slnx -c Release -o $(Build.ArtifactStagingDirectory)/publish --no-build
            displayName: 'Publish'

          # Crear ZIP del contenido publicado
          - task: ArchiveFiles@2
            displayName: 'Crear ZIP del publish'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/webapp.zip'
              replaceExistingArchive: true

          # Publicar el ZIP como artefacto
          - publish: $(Build.ArtifactStagingDirectory)/webapp.zip
            displayName: 'Publicar artefacto (webapp.zip)'
            artifact: drop

  # =======================
  #        DEPLOY
  # =======================
  - stage: Deploy
    displayName: 'Desplegar en App Service'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy job'
        environment: '$(environment)'
        strategy:
          runOnce:
            deploy:
              steps:
                # Descargar el artefacto "drop" del stage Build
                - download: current
                  displayName: 'Descargar artefacto'
                  artifact: drop

                # Desplegar el ZIP en la Web App
                - task: AzureWebApp@1
                  displayName: 'Deploy a Azure Web App'
                  inputs:
                    azureSubscription: 'azure-continuos-integration-connection'
                    appType: 'webApp'
                    appName: '$(appName)'
                    package: '$(Pipeline.Workspace)/drop/webapp.zip'
                    # Si despliegas a un slot:
                    # slotName: 'staging'
