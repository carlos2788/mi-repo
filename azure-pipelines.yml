
# azure-pipelines.yml
trigger:
  - main

variables:
  environment: 'dev'                        # p.ej.: staging/dev/prod
  appName: 'mi-azdevops-cd-staging'
  NUGET_PACKAGES: '$(Pipeline.Workspace)/.nuget/packages'

pool:
  vmImage: 'ubuntu-latest'

stages:
  # ---------- BUILD ----------
  - stage: Build
    displayName: 'Compilar y probar'
    jobs:
      - job: BuildJob
        displayName: 'Build job'
        steps:
          - checkout: self
            displayName: 'Checkout repo'

          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK 10.x'
            inputs:
              packageType: 'sdk'
              version: '10.0.100'

          # Diagnóstico
          - script: dotnet --info
            displayName: '.NET info'
          - script: dotnet --list-sdks
            displayName: 'SDKs instalados'

          # Preparar carpeta de caché
          - script: mkdir -p '$(NUGET_PACKAGES)'
            displayName: 'Crear carpeta NuGet en workspace'

          # Cache NuGet (clave en UNA sola línea)
          - task: Cache@2
            displayName: 'Cache NuGet (packages)'
            inputs:
              key: 'nuget | $(Agent.OS) | **/packages.lock.json, **/*.csproj, **/*.fsproj, **/*.vbproj'
              restoreKeys: 'nuget | $(Agent.OS)'
              path: '$(NUGET_PACKAGES)'

          # Restore (usando la carpeta cacheada)
          - script: dotnet restore MiApp.slnx
            displayName: 'Restore (.slnx)'
            workingDirectory: '$(Build.SourcesDirectory)'
            env:
              NUGET_PACKAGES: '$(NUGET_PACKAGES)'

          # Build
          - script: dotnet build MiApp.slnx -c Release --no-restore
            displayName: 'Build (.slnx)'
            workingDirectory: '$(Build.SourcesDirectory)'
            env:
              NUGET_PACKAGES: '$(NUGET_PACKAGES)'

          # Test (permitir continuar si el proyecto está vacío)
          - script: dotnet test test/MiApp.Tests/MiApp.Tests.csproj -c Release --no-build
            displayName: 'Test (permitir continuar si está vacío)'
            workingDirectory: '$(Build.SourcesDirectory)'
            continueOnError: true
            env:
              NUGET_PACKAGES: '$(NUGET_PACKAGES)'

          # (Opcional) Publicar artefactos si lo necesitas en la release
          # - script: dotnet publish MiApp.slnx -c Release -o $(Build.ArtifactStagingDirectory) --no-build
          #   displayName: 'Publish'
          #   workingDirectory: '$(Build.SourcesDirectory)'
          #   env:
          #     NUGET_PACKAGES: '$(NUGET_PACKAGES)'
          # - publish: $(Build.ArtifactStagingDirectory)
          #   artifact: drop

  # ---------- DEPLOY ----------
  - stage: Deploy
    displayName: 'Desplegar en Staging'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy job'
        environment: '$(environment)'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy a Azure Web App'
                  inputs:
                    azureSubscription: 'azure-continuos-integration-connection'
                    appType: 'webApp'
                    appName: '$(appName)'
                    package: '$(System.DefaultWorkingDirectory)/**/*.zip'
